<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ClassPulse</title>
<style>body{font-family:system-ui,sans-serif;background:#081A33;color:#fff;display:flex;align-items:center;justify-content:center;min-height:100vh;margin:0;text-align:center;padding:20px}</style>
</head>
<body>
<div id="msg">Loading the demo...</div>
<script>
  // GitHub Pages shows this page for any unknown address. For a published demo (<site>/d/...),
  // install the service worker that serves the demos, then reload: the second time it answers.
  (function () {
    var p = location.pathname, i = p.indexOf("/d/");
    var msg = document.getElementById("msg");
    if (i < 0) { msg.textContent = "Page not found."; return; }
    if (!("serviceWorker" in navigator)) { msg.textContent = "This browser cannot open published demos. Try Chrome, Firefox or Safari."; return; }
    var tries = Number(sessionStorage.getItem("cp_demo_tries") || 0);
    if (tries >= 2) { sessionStorage.removeItem("cp_demo_tries"); msg.textContent = "The demo cannot be opened (check the address, or reload the page)."; return; }
    sessionStorage.setItem("cp_demo_tries", tries + 1);
    var base = p.slice(0, i + 1);
    navigator.serviceWorker.register(base + "sw-demos.js", { scope: base + "d/" })
      .then(function () { return navigator.serviceWorker.ready; })
      .then(function () { setTimeout(function () { location.reload(); }, 200); })
      .catch(function (e) { msg.textContent = "The demo cannot be opened: " + e.message; });
  })();
</script>
</body>
</html>
