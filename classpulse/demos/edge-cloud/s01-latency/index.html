<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>How far is the cloud?</title>
<style>
  body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: #0B2545; color: #fff; padding: 20px 16px; }
  h1 { font-size: 24px; margin: 6px 0; }
  p { color: #A9C0D9; }
  button { width: 100%; font-size: 20px; padding: 14px; border: none; border-radius: 12px; background: #E8741E; color: #fff; font-weight: 700; margin: 10px 0; }
  button:disabled { opacity: 0.5; }
  .row { display: flex; justify-content: space-between; align-items: center; background: #13315C; border-radius: 10px; padding: 12px 14px; margin: 8px 0; }
  .ms { font-size: 22px; font-weight: 800; }
  .muted { color: #A9C0D9; font-size: 13px; }
</style>
</head>
<body>
  <h1>How far is the cloud?</h1>
  <p>Your phone will send a few tiny requests to data centres in several countries and measure the round trip time.</p>
  <button id="go">Measure</button>
  <div id="results"></div>
  <p class="muted" id="status"></p>

<script src="lib/mqtt.min.js"></script>
<script src="config.js"></script>
<script>
  const ALPHABET = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
  const phoneId = Array.from({ length: 4 }, () => ALPHABET[Math.floor(Math.random() * ALPHABET.length)]).join("");
  const room = latencyRoom();
  const client = mqtt.connect(LATENCY_CONFIG.brokerUrl, { clientId: "lat-" + phoneId + "-" + Math.random().toString(16).slice(2, 6), reconnectPeriod: 2000 });
  client.on("connect", () => { document.getElementById("status").textContent = "Connected. Your code: " + phoneId; });

  // One timed request. "no-cors" is enough: we only need the time, not the content.
  async function timeRequest(url) {
    const t0 = performance.now();
    await fetch(url + "?nocache=" + Math.random(), { mode: "no-cors", cache: "no-store" });
    return performance.now() - t0;
  }

  function median(values) {
    const s = values.slice().sort((a, b) => a - b);
    const m = Math.floor(s.length / 2);
    return s.length % 2 ? s[m] : (s[m - 1] + s[m]) / 2;
  }

  async function measureRegion(region) {
    try {
      for (let i = 0; i < LATENCY_CONFIG.warmupRequests; i++) await timeRequest(region.url);
      const times = [];
      for (let i = 0; i < LATENCY_CONFIG.measuredRequests; i++) times.push(await timeRequest(region.url));
      return Math.round(median(times));
    } catch (e) {
      return null; // unreachable from this network
    }
  }

  document.getElementById("go").onclick = async () => {
    const btn = document.getElementById("go");
    btn.disabled = true;
    btn.textContent = "Measuring...";
    const box = document.getElementById("results");
    box.innerHTML = "";
    const results = {};
    for (const region of LATENCY_CONFIG.regions) {
      const row = document.createElement("div");
      row.className = "row";
      row.innerHTML = `<span>${region.label}<br><span class="muted">${Math.round(distanceKm(LATENCY_CONFIG.origin, region))} km</span></span><span class="ms">...</span>`;
      box.appendChild(row);
      const ms = await measureRegion(region);
      results[region.key] = ms;
      row.querySelector(".ms").textContent = ms === null ? "failed" : ms + " ms";
    }
    const net = navigator.connection && navigator.connection.effectiveType ? navigator.connection.effectiveType : "unknown";
    client.publish(`${LATENCY_CONFIG.topicRoot}/${room}/result/${phoneId}`, JSON.stringify({ id: phoneId, net, results }));
    btn.disabled = false;
    btn.textContent = "Measure again";
    document.getElementById("status").textContent = "Sent to the big screen. Your code: " + phoneId;
  };
</script>
</body>
</html>
