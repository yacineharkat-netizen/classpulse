<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Supercomputer - dashboard</title>
<style>
  html, body { margin: 0; height: 100%; background: #081A33; color: #fff; font-family: "Segoe UI", system-ui, sans-serif; overflow: hidden; }
  #top { display: flex; align-items: center; gap: 26px; padding: 10px 20px; }
  #title { font-size: 26px; font-weight: 800; margin-right: auto; }
  .stat .v { font-size: 30px; font-weight: 800; text-align: right; }
  .stat .l { font-size: 11px; color: #8FA9C8; text-transform: uppercase; letter-spacing: 1px; text-align: right; }
  #main { display: flex; gap: 14px; padding: 0 20px; height: calc(100% - 140px); }
  #canvasBox { flex: 1; position: relative; display: flex; align-items: center; justify-content: center; }
  #picture, #overlay { position: absolute; max-width: 100%; max-height: 100%; aspect-ratio: 1200 / 720; background: #0B2545; border-radius: 6px; }
  #overlay { background: transparent; pointer-events: none; }
  #side { width: 360px; display: flex; flex-direction: column; gap: 10px; overflow: hidden; }
  .panel { background: #0F2B50; border-radius: 10px; padding: 10px 12px; }
  .panel h3 { margin: 0 0 6px; font-size: 14px; color: #8FA9C8; text-transform: uppercase; letter-spacing: 1px; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  td { padding: 3px 4px; border-bottom: 1px solid #1A3A63; }
  td.n { text-align: right; font-variant-numeric: tabular-nums; }
  .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; }
  #controls { display: flex; gap: 8px; align-items: center; padding: 8px 20px; font-size: 14px; color: #8FA9C8; flex-wrap: wrap; }
  #controls select, #controls button { font-size: 14px; padding: 6px 10px; border-radius: 8px; border: none; }
  #controls button { background: #1B7F8C; color: #fff; font-weight: 700; cursor: pointer; }
  #controls button.go { background: #E8741E; }
  #controls button.stop { background: #B83227; }
  #qr { position: absolute; inset: 0 0 56px 0; cursor: pointer; background: rgba(8,26,51,0.96); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; z-index: 5; }
  #qr .box { background: #fff; padding: 16px; border-radius: 14px; }
  #qr svg { width: 48vh; height: 48vh; display: block; }
  #qr .url { font-size: 22px; font-weight: 700; }
  #banner { position: absolute; left: 50%; top: 45%; transform: translate(-50%, -50%); background: rgba(8,26,51,0.9); padding: 18px 28px;
            border-radius: 14px; font-size: 28px; font-weight: 800; text-align: center; display: none; z-index: 3; }
  .hidden { display: none !important; }
</style>
</head>
<body>
  <div id="top">
    <div id="title">🧮 Your phones are a supercomputer</div>
    <div class="stat"><div class="v" id="sOnline">0</div><div class="l">machines online</div></div>
    <div class="stat"><div class="v" id="sTiles">0 / 0</div><div class="l">squares done</div></div>
    <div class="stat"><div class="v" id="sTime">0.0 s</div><div class="l">time</div></div>
    <div class="stat"><div class="v" id="sSpeed">-</div><div class="l">billion operations / s</div></div>
  </div>
  <div id="main">
    <div id="canvasBox">
      <canvas id="picture" width="1200" height="720"></canvas>
      <canvas id="overlay" width="1200" height="720"></canvas>
      <div id="banner"></div>
    </div>
    <div id="side">
      <div class="panel"><h3>Online</h3><div id="kinds"></div></div>
      <div class="panel" style="flex:1;overflow:hidden"><h3>Fastest machines (this run)</h3><table id="board"></table></div>
      <div class="panel"><h3>Results</h3><table id="results"></table></div>
    </div>
  </div>
  <div id="controls">
    Job <select id="jobSel"></select>
    work per pixel <select id="iterSel"></select>
    Who computes <select id="whoSel"></select>
    <button class="go" id="startBtn">▶ Start</button>
    <button id="localBtn">💻 This laptop alone (no network)</button>
    <button class="stop" id="stopBtn">■ Stop</button>
    <button id="clearBtn">Clear results</button>
    <span>· Q: QR code · room <b id="roomName"></b></span>
  </div>
  <div id="qr"><div class="box" id="qrBox"></div><div class="url" id="qrUrl"></div>
    <div style="color:#8FA9C8">Scan, tap "Join the computer" and keep the screen on · click or press Q to hide</div></div>

<script src="lib/mqtt.min.js"></script>
<script src="lib/qrcode.js"></script>
<script src="config.js"></script>
<script src="swarm.js"></script>
<script>
  // ============================================================== setup
  const room = swarmRoom();
  const root = `${SWARM_CONFIG.topicRoot}/${room}`;
  const $ = (id) => document.getElementById(id);
  const KIND = { phone: { label: "Phones", icon: "📱", color: "#E8741E" }, pi: { label: "Raspberry Pi", icon: "🍓", color: "#2BD17E" },
                 pc: { label: "Workstations", icon: "🖥", color: "#3AA0FF" }, laptop: { label: "Laptops", icon: "💻", color: "#C77DFF" } };
  $("roomName").textContent = room;

  const phoneUrl = new URL("index.html", window.location.href);
  if (room !== SWARM_CONFIG.defaultRoom) phoneUrl.searchParams.set("room", room);
  const qr = qrcode(0, "M"); qr.addData(phoneUrl.href); qr.make();
  $("qrBox").innerHTML = qr.createSvgTag({ cellSize: 9, margin: 1 });
  $("qrUrl").textContent = phoneUrl.href.replace(/^https?:\/\//, "");

  Object.entries(SWARM_CONFIG.jobs).forEach(([k, j]) => $("jobSel").insertAdjacentHTML("beforeend", `<option value="${k}">${j.label}</option>`));
  const ITERS = [20000, 50000, 100000, 200000, 500000, 1000000];
  function fillIters() {
    const j = SWARM_CONFIG.jobs[$("jobSel").value];
    const list = $("jobSel").value === "heavy" ? ITERS : [j.maxIter];
    $("iterSel").innerHTML = list.map((v) => `<option value="${v}" ${v === j.maxIter ? "selected" : ""}>${v.toLocaleString("en-US")} iterations max</option>`).join("");
  }
  $("jobSel").onchange = fillIters; fillIters();

  // colours: 0 = inside the set (black), 1..255 = escape speed (navy -> teal -> orange -> light yellow -> white)
  const STOPS = [[0, [8, 26, 51]], [0.35, [27, 127, 140]], [0.6, [232, 116, 30]], [0.8, [255, 214, 120]], [1, [255, 255, 255]]];
  const palette = [[5, 8, 20]];
  for (let v = 1; v < 256; v++) {
    const t = v / 255;
    let k = 0; while (t > STOPS[k + 1][0]) k++;
    const [a, ca] = STOPS[k], [b, cb] = STOPS[k + 1], f = (t - a) / (b - a);
    palette.push(ca.map((c, i) => Math.round(c + (cb[i] - c) * f)));
  }
  const ctx = $("picture").getContext("2d"), octx = $("overlay").getContext("2d");

  // ============================================================== state
  const workers = new Map();   // wid -> {name, kind, device, slots, lastSeen, online}
  let run = null;              // current run
  const results = [];          // finished runs
  let client = null;

  function newRun(mode, solo, label) {
    const preset = SWARM_CONFIG.jobs[$("jobSel").value];
    const job = { ...preset, maxIter: Number($("iterSel").value), id: Date.now().toString(36), state: "running", mode, solo: solo || null };
    const n = tileCount(job);
    return { job, label, n, pending: shuffledTiles(n), assigned: new Map(), done: new Uint8Array(n), doneCount: 0,
             start: performance.now(), end: null, iterations: 0, bytes: 0, stats: new Map(), tileMs: [] };
  }
  // random order: the picture fills everywhere at once (more fun, and fair)
  function shuffledTiles(n) {
    const a = [...Array(n).keys()];
    for (let i = n - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
    return a;
  }

  // ============================================================== MQTT
  client = mqtt.connect(SWARM_CONFIG.brokerUrl, { clientId: "swdash-" + Math.random().toString(16).slice(2, 8), reconnectPeriod: 2000 });
  client.on("connect", () => {
    client.subscribe([`${root}/hello`, `${root}/bye`, `${root}/req`, `${root}/res`]);
    publishJob({ id: "none", state: "idle" });
    showBanner("Scan the QR code (press Q), then press Start", 0);
  });
  client.on("message", (topic, payload) => {
    let m; try { m = JSON.parse(payload.toString()); } catch (e) { return; }
    const kind = topic.slice(root.length + 1);
    if (kind === "hello") onHello(m);
    else if (kind === "bye") { const w = workers.get(m.wid); if (w) { w.online = false; releaseTilesOf(m.wid); } }
    else if (kind === "req") onRequest(m);
    else if (kind === "res") onResult(m, payload.length);
  });
  function publishJob(job) { client.publish(`${root}/job`, JSON.stringify(job), { retain: true, qos: 1 }); }

  function onHello(m) {
    const w = workers.get(m.wid) || { tiles: 0 };
    Object.assign(w, { name: m.name, kind: KIND[m.kind] ? m.kind : "pc", device: m.device, slots: m.slots || 1, lastSeen: Date.now(), online: true });
    workers.set(m.wid, w);
    fillWho();
  }

  // ============================================================== coordinator: who gets which square
  function eligible(wid) {
    const w = workers.get(wid);
    if (!run || run.end || !w) return false;
    const mode = run.job.mode;
    return mode === "all" || (mode === "phones" && w.kind === "phone") || (mode === "solo" && run.job.solo === wid);
  }

  function onRequest(m) {
    const w = workers.get(m.wid);
    if (w) { w.lastSeen = Date.now(); w.online = true; }
    if (!run || run.end || m.job !== run.job.id || !eligible(m.wid)) { sendTask(m.wid, [], 3000); return; }
    const tiles = [];
    while (tiles.length < (m.slots || 1) && run.pending.length) {
      const t = run.pending.shift();
      if (run.done[t]) continue;
      tiles.push(t);
      run.assigned.set(t, { wid: m.wid, at: Date.now(), backup: false });
    }
    // queue empty: give a copy of an old square still being computed by a slow machine (backup task)
    if (tiles.length === 0) {
      const slow = Math.max(3000, 2.5 * median(run.tileMs));
      for (const [t, a] of run.assigned) {
        if (!run.done[t] && !a.backup && a.wid !== m.wid && Date.now() - a.at > slow) { a.backup = true; tiles.push(t); break; }
      }
    }
    sendTask(m.wid, tiles, 800);
  }
  function sendTask(wid, tiles, wait) {
    const msg = JSON.stringify({ job: run ? run.job.id : null, tiles, wait });
    if (run && tiles.length) run.bytes += msg.length;
    client.publish(`${root}/task/${wid}`, msg);
  }

  function onResult(m, size) {
    const w = workers.get(m.wid);
    if (w) { w.lastSeen = Date.now(); w.online = true; }
    if (!run || m.job !== run.job.id || run.done[m.tile]) return;   // old run, or a backup copy that arrived second
    run.bytes += size;
    acceptTile(m.tile, base64ToBytes(m.data), m.wid, w ? w.kind : "pc", m.it, m.ms);
  }

  function acceptTile(t, bytes, wid, kind, it, ms) {
    run.done[t] = 1; run.doneCount++; run.assigned.delete(t);
    run.iterations += it;
    run.tileMs.push(ms); if (run.tileMs.length > 200) run.tileMs.shift();
    const s = run.stats.get(wid) || { tiles: 0, it: 0, ms: 0 };
    s.tiles++; s.it += it; s.ms += ms; run.stats.set(wid, s);
    drawTile(t, bytes, KIND[kind].color);
    if (run.doneCount === run.n) finishRun();
  }

  // A machine that disappeared: its squares go back to the front of the queue.
  function releaseTilesOf(wid) {
    if (!run || run.end) return;
    for (const [t, a] of run.assigned) if (a.wid === wid && !run.done[t]) { run.assigned.delete(t); run.pending.unshift(t); }
  }
  setInterval(() => {
    for (const [wid, w] of workers) if (w.online && Date.now() - w.lastSeen > SWARM_CONFIG.offlineAfterMs) { w.online = false; releaseTilesOf(wid); }
    refresh();
  }, 1000);

  function finishRun() {
    run.end = performance.now();
    const seconds = (run.end - run.start) / 1000;
    const who = [...run.stats.keys()].map((wid) => workers.get(wid)).filter(Boolean);
    const count = (k) => who.filter((w) => w.kind === k).length;
    const parts = Object.keys(KIND).filter((k) => count(k)).map((k) => `${count(k)} ${KIND[k].icon}`).join(" ");
    results.push({ label: run.label + (parts && run.job.mode !== "solo" ? " · " + parts : ""), seconds, estimated: false, maxIter: run.job.maxIter,
                   iterations: run.iterations, bytes: run.bytes, preset: $("jobSel").value });
    addEstimates();
    if (run.job.mode !== "local") publishJob({ ...run.job, state: "done" });
    showBanner(`Finished in ${seconds.toFixed(1)} s`, 6000);
    publishBoard();
    refresh();
  }

  // After a run: how long ONE machine of each type would need alone, from its measured speed.
  function addEstimates() {
    const byKind = {};
    for (const [wid, s] of run.stats) {
      const w = workers.get(wid); if (!w || !s.ms) continue;
      const rate = (s.it / s.ms) * (w.slots || 1);   // iterations per ms, all its cores together
      (byKind[w.kind] = byKind[w.kind] || []).push({ rate, name: w.name });
    }
    const phones = byKind.phone || [];
    if (phones.length > 1) {
      const med = median(phones.map((p) => p.rate));
      results.push({ label: `One typical phone alone (estimated)`, seconds: run.iterations / med / 1000, estimated: true, maxIter: run.job.maxIter });
    }
    ["pi", "pc"].forEach((k) => (byKind[k] || []).forEach((m) => {
      if (run.job.mode === "solo") return;
      results.push({ label: `${m.name} alone (estimated)`, seconds: run.iterations / m.rate / 1000, estimated: true, maxIter: run.job.maxIter });
    }));
  }

  // ============================================================== "this laptop alone": no network at all
  let localEngine = null;
  function runLocal() {
    stopRun(true);
    run = newRun("local", null, "💻 This laptop alone, 1 core, no network");
    clearPicture();
    publishJob({ ...run.job, state: "local" });   // the phones just watch
    localEngine = new Worker("compute-worker.js");
    const next = () => {
      if (!run || run.end || run.job.mode !== "local") return;
      const t = run.pending.shift();
      if (t === undefined) return;
      localEngine.postMessage({ job: run.job, tile: t });
    };
    localEngine.onmessage = (e) => {
      if (!run || run.job.mode !== "local") return;
      acceptTile(e.data.tile, base64ToBytes(e.data.data), "local", "laptop", e.data.it, e.data.ms);
      next();
    };
    next();
  }

  // ============================================================== controls
  function fillWho() {
    const keep = $("whoSel").value;
    const solos = [...workers.entries()].filter(([, w]) => w.online && w.kind !== "phone");
    $("whoSel").innerHTML = `<option value="all">Everyone (phones + machines)</option><option value="phones">Phones only</option>` +
      solos.map(([wid, w]) => `<option value="solo:${wid}">${KIND[w.kind].icon} ${w.name} alone</option>`).join("");
    if ([...$("whoSel").options].some((o) => o.value === keep)) $("whoSel").value = keep;
  }
  $("startBtn").onclick = () => {
    stopRun(true);
    const v = $("whoSel").value;
    const mode = v.startsWith("solo:") ? "solo" : v;
    const solo = mode === "solo" ? v.slice(5) : null;
    const label = mode === "all" ? "Everyone" : mode === "phones" ? "📱 Phones only" : `${KIND[workers.get(solo).kind].icon} ${workers.get(solo).name} alone`;
    run = newRun(mode, solo, label);
    clearPicture();
    publishJob(run.job);
    $("qr").classList.add("hidden");
    showBanner("", 0);
  };
  $("localBtn").onclick = runLocal;
  $("qr").onclick = () => $("qr").classList.add("hidden");
  $("stopBtn").onclick = () => stopRun(false);
  $("clearBtn").onclick = () => { results.length = 0; refresh(); };
  function stopRun(silent) {
    if (localEngine) { localEngine.terminate(); localEngine = null; }
    if (run && !run.end) { run.end = performance.now(); if (!silent) showBanner("Stopped", 3000); }
    if (client.connected) publishJob({ id: run ? run.job.id : "none", state: "stopped" });
  }
  document.addEventListener("keydown", (e) => {
    if (e.target.tagName === "SELECT") return;
    if (e.key.toLowerCase() === "q") $("qr").classList.toggle("hidden");
  });

  // ============================================================== drawing
  function clearPicture() { ctx.fillStyle = "#0B2545"; ctx.fillRect(0, 0, 1200, 720); octx.clearRect(0, 0, 1200, 720); }
  function drawTile(t, bytes, color) {
    const g = tileGeometry(run.job, t), n = run.job.tile;
    const img = ctx.createImageData(n, n);
    for (let i = 0; i < n * n; i++) { const c = palette[bytes[i]]; img.data.set([c[0], c[1], c[2], 255], i * 4); }
    ctx.putImageData(img, g.tx * n, g.ty * n);
    // frame in the colour of the machine that computed it, fading away
    octx.strokeStyle = color; octx.lineWidth = 3;
    octx.strokeRect(g.tx * n + 1.5, g.ty * n + 1.5, n - 3, n - 3);
    setTimeout(() => octx.clearRect(g.tx * n, g.ty * n, n, n), 1500);
  }
  function showBanner(text, ms) {
    $("banner").textContent = text; $("banner").style.display = text ? "block" : "none";
    if (ms) setTimeout(() => { if ($("banner").textContent === text) $("banner").style.display = "none"; }, ms);
  }

  // ============================================================== figures
  function median(v) { if (!v.length) return 0; const s = v.slice().sort((a, b) => a - b); const m = Math.floor(s.length / 2); return s.length % 2 ? s[m] : (s[m - 1] + s[m]) / 2; }
  function fmtTime(s) { return s >= 3600 ? (s / 3600).toFixed(1) + " h" : s >= 120 ? (s / 60).toFixed(1) + " min" : s.toFixed(1) + " s"; }

  function refresh() {
    const online = [...workers.values()].filter((w) => w.online);
    $("sOnline").textContent = online.length;
    $("kinds").innerHTML = Object.entries(KIND).map(([k, d]) => `<span style="margin-right:14px;font-size:18px"><span class="dot" style="background:${d.color}"></span>${d.icon} ${online.filter((w) => w.kind === k).length}</span>`).join("");
    if (run) {
      const el = ((run.end || performance.now()) - run.start) / 1000;
      $("sTiles").textContent = `${run.doneCount} / ${run.n}`;
      $("sTime").textContent = el.toFixed(1) + " s";
      $("sSpeed").textContent = el > 0 ? (run.iterations / el / 1e9).toFixed(2) : "-";
      const rows = [...run.stats.entries()].map(([wid, s]) => ({ wid, s, w: workers.get(wid) || { name: "This laptop", kind: "laptop", slots: 1 } }))
        .sort((a, b) => b.s.tiles - a.s.tiles).slice(0, 12);
      $("board").innerHTML = rows.map((r) => `<tr><td><span class="dot" style="background:${KIND[r.w.kind].color}"></span>${esc(r.w.name)}</td>
        <td class="n">${r.s.tiles} sq.</td><td class="n">${Math.round((r.s.it / Math.max(1, r.s.ms)) * (r.w.slots || 1) / 1000)} M/s</td></tr>`).join("");
    }
    $("results").innerHTML = results.slice(-8).map((r) => `<tr><td>${esc(r.label)}${r.preset === "light" ? " (light)" : ""}</td>
      <td class="n" style="${r.estimated ? "color:#8FA9C8" : "font-weight:800"}">${r.estimated ? "≈ " : ""}${fmtTime(r.seconds)}</td></tr>`).join("") ||
      `<tr><td style="color:#8FA9C8">No run yet</td></tr>`;
  }
  // every 2 s during a run: rank of every phone (each phone shows its own rank)
  function publishBoard() {
    if (!run || run.job.mode === "local") return;
    const rank = [...run.stats.entries()].sort((a, b) => b[1].tiles - a[1].tiles)
      .map(([wid, s]) => ({ wid, share: Math.round((100 * s.tiles) / run.n) }));
    client.publish(`${root}/board`, JSON.stringify({ job: run.job.id, rank }));
  }
  setInterval(() => { if (run && !run.end) publishBoard(); }, 2000);
  setInterval(() => { if (run && !run.end) { $("sTime").textContent = ((performance.now() - run.start) / 1000).toFixed(1) + " s"; } }, 100);
  function esc(t) { return String(t).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }
  clearPicture(); refresh();
</script>
</body>
</html>
