<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>How far is the cloud? - dashboard</title>
<style>
  html, body { margin: 0; height: 100%; background: #081A33; color: #fff; font-family: "Segoe UI", system-ui, sans-serif; overflow: hidden; }
  #top { display: flex; align-items: center; gap: 30px; padding: 16px 24px; }
  #title { font-size: 30px; font-weight: 800; margin-right: auto; }
  .counter .v { font-size: 42px; font-weight: 800; text-align: right; }
  .counter .l { font-size: 13px; color: #8FA9C8; text-transform: uppercase; letter-spacing: 1px; }
  #chart { width: calc(100% - 48px); margin: 0 24px; display: block; }
  #legend { padding: 6px 24px; color: #8FA9C8; font-size: 15px; }
  #legend span { margin-right: 26px; }
  #qr { position: absolute; inset: 0; background: rgba(8,26,51,0.96); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; }
  #qr .box { background: #fff; padding: 18px; border-radius: 16px; }
  #qr svg { width: 50vh; height: 50vh; display: block; }
  #qr .url { font-size: 24px; font-weight: 700; }
  #local { position: absolute; right: 24px; bottom: 12px; color: #8FA9C8; font-size: 13px; }
  #local input { width: 70px; font-size: 14px; }
  .hidden { display: none !important; }
</style>
</head>
<body>
  <div id="top">
    <div id="title">How far is the cloud?</div>
    <div class="counter"><div class="v" id="nPhones">0</div><div class="l">phones measured</div></div>
  </div>
  <canvas id="chart"></canvas>
  <div id="legend">
    <span style="color:#2BD17E">▌ physical minimum (speed of light in fiber)</span>
    <span style="color:#E8741E">● one phone</span>
    <span style="color:#fff">▌ median of the room</span>
  </div>
  <div id="qr"><div class="box" id="qrBox"></div><div class="url" id="qrUrl"></div><div style="color:#8FA9C8">Press Q to show / hide</div></div>
  <div id="local">Local edge server in this room, measured by the teacher (ms): <input id="localMs" type="number" step="0.1"> · Q: QR code · R: reset</div>

<script src="lib/mqtt.min.js"></script>
<script src="lib/qrcode.js"></script>
<script src="config.js"></script>
<script>
  const room = latencyRoom();
  const phoneUrl = new URL("index.html", window.location.href);
  if (room !== LATENCY_CONFIG.defaultRoom) phoneUrl.searchParams.set("room", room);
  const qr = qrcode(0, "M"); qr.addData(phoneUrl.href); qr.make();
  document.getElementById("qrBox").innerHTML = qr.createSvgTag({ cellSize: 9, margin: 1 });
  document.getElementById("qrUrl").textContent = phoneUrl.href.replace(/^https?:\/\//, "");

  const phones = {}; // id -> results
  const client = mqtt.connect(LATENCY_CONFIG.brokerUrl, { clientId: "latdash-" + Math.random().toString(16).slice(2, 8), reconnectPeriod: 2000 });
  client.on("connect", () => client.subscribe(`${LATENCY_CONFIG.topicRoot}/${room}/result/+`));
  client.on("message", (topic, msg) => {
    try { const d = JSON.parse(msg.toString()); phones[d.id] = d.results; draw(); } catch (e) { /* ignore bad message */ }
  });

  function median(v) { const s = v.slice().sort((a, b) => a - b); const m = Math.floor(s.length / 2); return s.length % 2 ? s[m] : (s[m - 1] + s[m]) / 2; }

  function rows() {
    const list = [];
    const local = parseFloat(document.getElementById("localMs").value);
    if (!isNaN(local)) list.push({ label: "Edge server in this room", km: 0, min: 0, values: [local], local: true });
    for (const r of LATENCY_CONFIG.regions) {
      const values = Object.values(phones).map((res) => res[r.key]).filter((x) => typeof x === "number");
      list.push({ label: r.label, km: Math.round(distanceKm(LATENCY_CONFIG.origin, r)), min: minimumRttMs(r), values });
    }
    return list;
  }

  function draw() {
    document.getElementById("nPhones").textContent = Object.keys(phones).length;
    const c = document.getElementById("chart");
    const ratio = window.devicePixelRatio || 1;
    const w = c.clientWidth, h = window.innerHeight - 170;
    c.width = w * ratio; c.height = h * ratio; c.style.height = h + "px";
    const ctx = c.getContext("2d");
    ctx.setTransform(ratio, 0, 0, ratio, 0, 0);
    ctx.clearRect(0, 0, w, h);
    const data = rows();
    const all = data.flatMap((d) => d.values).concat(data.map((d) => d.min));
    const maxMs = Math.max(100, Math.ceil(Math.max(...all, 0) / 50) * 50 + 50);
    const left = 260, right = w - 30, top = 10, rowH = (h - 50) / data.length;
    const x = (ms) => left + (ms / maxMs) * (right - left);
    // grid
    ctx.font = "13px Segoe UI"; ctx.fillStyle = "#8FA9C8"; ctx.strokeStyle = "#1A3A63";
    for (let ms = 0; ms <= maxMs; ms += maxMs > 400 ? 100 : 50) {
      ctx.beginPath(); ctx.moveTo(x(ms), top); ctx.lineTo(x(ms), h - 30); ctx.stroke();
      ctx.fillText(ms + " ms", x(ms) - 16, h - 10);
    }
    data.forEach((d, i) => {
      const y = top + i * rowH + rowH / 2;
      ctx.fillStyle = d.local ? "#2BB3C0" : "#fff";
      ctx.font = "bold 20px Segoe UI"; ctx.fillText(d.label, 16, y - 2);
      ctx.font = "14px Segoe UI"; ctx.fillStyle = "#8FA9C8";
      ctx.fillText(d.local ? "a few metres" : d.km.toLocaleString("en-US") + " km", 16, y + 18);
      // physical minimum
      if (!d.local) { ctx.fillStyle = "#2BD17E"; ctx.fillRect(x(d.min) - 2, y - rowH * 0.35, 4, rowH * 0.7); }
      // phones
      d.values.forEach((v, k) => {
        ctx.beginPath(); ctx.fillStyle = d.local ? "#2BB3C0" : "rgba(232,116,30,0.75)";
        ctx.arc(x(v), y + ((k * 7) % 21) - 10, 6, 0, Math.PI * 2); ctx.fill();
      });
      if (d.values.length) {
        const m = median(d.values);
        ctx.fillStyle = "#fff"; ctx.fillRect(x(m) - 2, y - rowH * 0.42, 4, rowH * 0.84);
        ctx.font = "bold 22px Segoe UI"; ctx.fillText((m < 10 ? m.toFixed(1) : Math.round(m)) + " ms", Math.min(x(m) + 10, right - 80), y - rowH * 0.2);
      }
    });
  }

  document.addEventListener("keydown", (e) => {
    const k = e.key.toLowerCase();
    if (e.target.tagName === "INPUT") return;
    if (k === "q") document.getElementById("qr").classList.toggle("hidden");
    if (k === "r") { for (const id in phones) delete phones[id]; draw(); }
  });
  document.getElementById("localMs").oninput = draw;
  window.onresize = draw;
  draw();
</script>
</body>
</html>
